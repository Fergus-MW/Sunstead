[project]
name = "avatar-agent"
version = "0.1.0"
description = "Live video AI assistant that joins Google Meet as a photorealistic streaming avatar (Recall.ai + Anam + LiveKit Agents)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Orchestration: the realtime STT -> LLM -> TTS pipeline + turn-taking.
    "livekit-agents>=1.6,<2",
    # Avatar: renders a real-time, lip-synced talking face into the LiveKit room.
    "livekit-plugins-anam>=1.6,<2",
    # Cognition (cascade pipeline). Swappable per PIPELINE_MODE — see config.py.
    "livekit-plugins-anthropic>=1.6,<2",
    "livekit-plugins-deepgram>=1.6,<2",
    "livekit-plugins-cartesia>=1.6,<2",
    "livekit-plugins-silero>=1.6,<2",
    "livekit-plugins-turn-detector>=1.6,<2",
    # Cognition (realtime pipeline, single-model option).
    "livekit-plugins-openai>=1.6,<2",
    # Recall.ai dispatch + backend tool calls.
    "httpx>=0.27",
    # Config / secrets.
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
# `avatar-agent` runs the LiveKit worker; `dispatch-bot` sends a bot into a Meet.
avatar-agent = "avatar_agent.agent:main"
dispatch-bot = "avatar_agent.dispatch:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/avatar_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
