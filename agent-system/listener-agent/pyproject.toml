[project]
name = "listener-agent"
version = "0.1.0"
description = "Agent A: two-tier parse -> decide -> delegate -> speak"
requires-python = ">=3.11"
dependencies = [
    "shared",
    "anthropic",
]

[tool.uv.sources]
shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/listener_agent"]
