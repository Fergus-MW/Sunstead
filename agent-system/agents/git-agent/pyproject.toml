[project]
name = "git-agent"
version = "0.1.0"
description = "Agent D: repo/git lookups (often answered from KG)"
requires-python = ">=3.11"
dependencies = [
    "shared",
    "anthropic",
]

[tool.uv.sources]
shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/git_agent"]
