[project]
name = "data-agent"
version = "0.1.0"
description = "Agent C: data analysis"
requires-python = ">=3.11"
dependencies = [
    "shared",
    "anthropic",
    "pandas",
]

[tool.uv.sources]
shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_agent"]
