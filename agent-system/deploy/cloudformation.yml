AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Sunstead agent suite — one always-on EC2 host running runner/planner/gateway/sites via Docker.
  App traffic egresses through a Cloudflare Tunnel, so the security group is SSH-only (locked to your IP).
  On first boot it installs Docker + Compose and clones the repo; you then drop in secrets and run deploy.sh.

Parameters:
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: An existing EC2 key pair name for SSH access.
  AllowedSshCidr:
    Type: String
    Description: Your public IP in CIDR form (e.g. 203.0.113.4/32). SSH is restricted to this.
    AllowedPattern: '^\d{1,3}(\.\d{1,3}){3}/\d{1,2}$'
    ConstraintDescription: Must be a CIDR like 203.0.113.4/32
  InstanceType:
    Type: String
    Default: t3.medium
    AllowedValues: [t3.small, t3.medium, t3.large]
    Description: t3.medium (4 GB) recommended; the four procs + Node + matplotlib are tight on 2 GB.
  RepoUrl:
    Type: String
    Default: https://github.com/Fergus-MW/Sunstead.git

Resources:
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Sunstead agent suite — SSH only (app traffic via Cloudflare Tunnel, outbound).
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AllowedSshCidr

  Instance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      ImageId: '{{resolve:ssm:/aws/service/canonical/ubuntu/server/22.04/stable/current/amd64/hvm/ebs-gp2/ami-id}}'
      SecurityGroupIds: [!Ref SecurityGroup]
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 20
            VolumeType: gp3
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: sunstead-agent-suite
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -eux
          apt-get update && apt-get install -y ca-certificates curl git
          curl -fsSL https://get.docker.com | sh
          usermod -aG docker ubuntu
          cd /home/ubuntu
          git clone ${RepoUrl} Sunstead
          chown -R ubuntu:ubuntu Sunstead

Outputs:
  PublicIp:
    Description: Public IP of the agent-suite host.
    Value: !GetAtt Instance.PublicIp
  SshCommand:
    Description: SSH in once it's booted.
    Value: !Sub "ssh ubuntu@${Instance.PublicIp}"
  NextSteps:
    Value: "cd Sunstead/agent-system → add ca.pem/service.cert/service.key + .env (from .env.aws.example) → bash deploy/deploy.sh"
