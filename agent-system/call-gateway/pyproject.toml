[project]
name = "call-gateway"
version = "0.1.0"
description = "Recall->Soniox->Kafka transcript (+ mock WAV source, + TTS out)"
requires-python = ">=3.11"
dependencies = [
    "shared",
    "websockets",
    "httpx",
]

[tool.uv.sources]
shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/call_gateway"]
