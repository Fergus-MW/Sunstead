[project]
name = "agent-system"
version = "0.1.0"
description = "Sunstead live-call agent subsystem"
requires-python = ">=3.11"
dependencies = ["shared"]

[tool.uv.workspace]
members = [
    "shared",
    "call-gateway",
    "listener-agent",
    "gateway",
    "agents/web-agent",
    "agents/data-agent",
    "agents/git-agent",
]

[tool.uv.sources]
shared = { workspace = true }
