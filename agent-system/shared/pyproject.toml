[project]
name = "shared"
version = "0.1.0"
description = "Shared contracts, Kafka helpers, Aiven MCP session, harness, and config"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7",
    "aiokafka>=0.11",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shared"]
