[project]
name = "shared"
version = "0.1.0"
description = "Shared contracts, kafka helpers, KG client, and config"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "aiokafka>=0.11",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shared"]
