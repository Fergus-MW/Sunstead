[project]
name = "gateway"
version = "0.1.0"
description = "Thin FE-facing REST + Kafka->WS bridge"
requires-python = ">=3.11"
dependencies = [
    "shared",
    "fastapi",
    "uvicorn",
    "websockets",
]

[tool.uv.sources]
shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway"]
