[project]
name = "agent-runner"
version = "0.1.0"
description = "Sunstead agent-runner container — Kafka consumer + harness + specialist agents"
requires-python = ">=3.10"
dependencies = [
    "shared",
    "anthropic[mcp]>=0.49",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_runner"]

[tool.uv.sources]
shared = { workspace = true }
