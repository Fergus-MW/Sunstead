[project]
name = "central-kg-api"
version = "0.1.0"
description = "Real-time agent context API backed by a Postgres knowledge graph (Aiven-ready, Lambda-ready)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "mangum>=0.18",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "asyncpg>=0.29",
    "sqlalchemy[asyncio]>=2.0.30",
    "pgvector>=0.3.6",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "orjson>=3.10",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
