services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: central_kg_postgres
    environment:
      POSTGRES_USER: kg
      POSTGRES_PASSWORD: kg
      POSTGRES_DB: kg
    ports:
      - "5432:5432"
    volumes:
      - kg_pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kg -d kg"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  kg_pgdata:
